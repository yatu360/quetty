[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queue-load-test"
version = "0.1.0"
description = "Authorised Queue-it staging test foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camoufox==0.5.6",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "playwright==1.62.0",
    "patchright==1.63.0",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
benchmark = [
    "psutil>=6,<8",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
queue-load-test = "queue_load_test.main:main"
queue-load-test-phase1 = "queue_load_test.harness.staging:main"
queue-load-test-phase2-restore = "queue_load_test.harness.phase2_restore:main"
queue-load-test-phase2-resources = "queue_load_test.harness.phase2_resources:main"
queue-load-test-phase2-tuning = "queue_load_test.harness.phase2_tuning:main"
queue-load-test-phase3-repository = "queue_load_test.harness.phase3_repository:main"
queue-load-test-phase3-browser-capacity = "queue_load_test.harness.phase3_browser_capacity:main"
queue-load-test-phase3-acquisition = "queue_load_test.harness.phase3_acquisition:main"
queue-load-test-phase3-monitoring = "queue_load_test.harness.phase3_monitoring:main"
queue-load-test-phase3-storage = "queue_load_test.harness.phase3_storage:main"
queue-load-test-state-check = "queue_load_test.harness.state_consistency:main"
queue-load-test-phase3-recovery = "queue_load_test.harness.phase3_recovery:main"
queue-load-test-phase4-acquisition = "queue_load_test.harness.phase4_acquisition:main"
queue-load-test-phase4-monitoring = "queue_load_test.harness.phase4_monitoring:main"
queue-load-test-phase4-recovery = "queue_load_test.harness.phase4_recovery:main"
queue-load-test-ui = "queue_load_test.web.cli:main"
queue-load-test-phase5-ui-benchmark = "queue_load_test.harness.phase5_ui_benchmark:main"
queue-load-test-phase5-workflow = "queue_load_test.harness.phase5_workflow:main"
queue-load-test-camoufox-preflight = "queue_load_test.harness.camoufox_preflight:main"
queue-load-test-patchright-preflight = "queue_load_test.harness.patchright_preflight:main"
queue-load-test-phase6-camoufox-benchmark = "queue_load_test.harness.phase6_camoufox_benchmark:main"
queue-load-test-phase7-patchright-identity = "queue_load_test.harness.phase7_patchright_identity:main"
queue-load-test-phase7-patchright-runtime = "queue_load_test.harness.phase7_patchright_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/queue_load_test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not staging'"
markers = [
    "staging: opt-in tests that send browser traffic to an authorised staging environment",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
